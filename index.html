<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
        <div class="container">
            <div class="row">
                <div class="col-6  p-3 pb-1 mt-5"><img class="img-fluid" src="./images/login_img.avif" alt=""></div>
                <div class="col-6 border border-3 rounded-4 p-3 pb-1 mt-5">
                    <h2 class="text-center text-success fw-bold">Login Form</h2>
                    <form>
                        <div class="mb-3">
                          <label for="exampleInputEmail1" class="form-label">Email address</label>
                          <input type="email" class="form-control text-success" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter your email address">
                          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                        </div>
                        <div class="mb-3">
                          <label for="exampleInputPassword1" class="form-label">Password</label>
                          <input type="password" class="form-control text-danger" id="exampleInputPassword1" placeholder="Enter your password">
                        </div>
                        <div class="mb-3 form-check">
                          <input type="checkbox" class="form-check-input" id="exampleCheck1">
                          <label class="form-check-label" for="exampleCheck1">Check me out</label>
                        </div>

                        <div class="text-center"><button type="submit" class="btn btn-primary w-50">Login</button>
                        </div>
    
                        <div class="d-flex justify-content-between">
                            <Button class="btn btn-link">Remember me</Button>
                            <Button class="btn text-secondary">Forgot password?</Button>
                        </div>
                
    
                        <div class="row text-center">
                            <div class="col"><hr class="text-secondary"></div>
                            <div class="col"><p>or</p></div>
                            <div class="col"><hr class="text-secondary"></div>
                        </div>
                
                        <div class="m-3">
                            <Button class="rounded-2 btn btn-primary ms-5 w-75"><i class="fa-brands fa-facebook"></i> LOGIN WITH FACEBOOK</Button>
                        </div>
                        <div class="m-3">
                            <Button class="rounded-2 btn btn-info ms-5 w-75"><i class="fa-brands fa-twitter mt-2 text-light"></i> LOGIN WITH TWITTER</Button>
                        </div>
                        <div class="m-3">
                            <Button class="rounded-2 btn btn-danger ms-5 w-75"><i class="fa-brands fa-instagram mt-2"></i> LOGIN WITH INSTAGRAM</Button>
                        </div>
                      </form>
                </div>
            </div>
            
        </div>

</body>
</html>
